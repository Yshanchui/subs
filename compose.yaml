services:
  subs:
    image: yshanchui/subs:20261026
    restart: unless-stopped
    environment:
      SUBS_LISTEN: "0.0.0.0:8787"
      SUBS_DATA_DIR: /data
      SUBS_ADMIN_USER: "${SUBS_ADMIN_USER:-admin}"
      SUBS_ADMIN_PASSWORD: "${SUBS_ADMIN_PASSWORD:?请在同目录 .env 中设置 12-72 字节的管理员密码}"
      SUBS_PUBLIC_URL: "https://${SUBS_DOMAIN:?请在同目录 .env 中设置域名}"
      SUBS_SECURE_COOKIE: "true"
      SUBS_ALLOW_PRIVATE_UPSTREAM: "${SUBS_ALLOW_PRIVATE_UPSTREAM:-false}"
    volumes:
      - subs-data:/data

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      subs:
        condition: service_healthy
    environment:
      SUBS_DOMAIN: "${SUBS_DOMAIN:?请在同目录 .env 中设置域名}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?请在同目录 .env 中设置 Cloudflare DNS API Token}"
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  subs-data:
    name: subs-data
  caddy-data:
    name: subs-caddy-data
  caddy-config:
    name: subs-caddy-config
